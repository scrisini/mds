# Rejects plaintext secrets in the repository (scripts/check-secrets.sh): unencrypted files under
# config/secrets/, key files, private keys, AWS access key ids and Vault tokens. The pre-commit hook
# does the same for each commit; this catches commits made without the hook.
name: secrets

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  plaintext-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check tracked files
        run: scripts/check-secrets.sh --all

      - name: Test the check
        run: scripts/test-check-secrets.sh
