# Local development only: README "Running locally", and "In Docker" for running mds here.
# Production runs on ECS or EKS (docs/deployment.md).
#
#   docker compose up -d                  InfluxDB only; run mds from the IDE or scripts/dev.sh run
#   docker compose --profile app up -d    InfluxDB, mds, Prometheus and Grafana (scripts/dev.sh docker)
#
# The mds image is the one production uses, built with buildpacks:
#   ./gradlew bootBuildImage --imageName=mds:local
services:
  influxdb:
    image: influxdb:2.7
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: admin-password
      DOCKER_INFLUXDB_INIT_ORG: mds
      DOCKER_INFLUXDB_INIT_BUCKET: prices
      DOCKER_INFLUXDB_INIT_RETENTION: 0s   # keep forever (archive)
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: mds-dev-token
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2
    networks:
      - mds
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  mds:
    profiles: ["app"]
    image: ${MDS_IMAGE:-mds:local}
    pull_policy: never   # built locally, see above
    depends_on:
      influxdb:
        condition: service_healthy
    # InfluxDB connection and other mds settings for this network
    env_file: config/docker.env
    environment:
      # Runtime settings of the buildpack image, as in deploy/ (docs/deployment.md "Container images")
      BPL_JAVA_NMT_ENABLED: "false"
      JAVA_TOOL_OPTIONS: -XX:MaxDirectMemorySize=192m
    # The heap is sized from this limit (about the limit minus 650 MiB); below 1 GiB mds doesn't start
    mem_limit: 1536m
    # Spring waits up to 30s per shutdown phase (spring.lifecycle.timeout-per-shutdown-phase)
    stop_grace_period: 60s
    ports:
      - "${MDS_HTTP_PORT:-8080}:8080"   # REST, SSE, WebSocket, actuator
      - "${MDS_GRPC_HOST_PORT:-9090}:9090"   # gRPC
    networks:
      - mds

  # Scrapes mds (/actuator/prometheus) and InfluxDB (/metrics) for Grafana
  prometheus:
    profiles: ["app"]
    image: prom/prometheus:v3.4.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9091}:9090"   # not 9090: that is mds gRPC
    networks:
      - mds

  # Dashboards (config/grafana/dashboards) on http://localhost:3000, data sources Prometheus and InfluxDB
  grafana:
    profiles: ["app"]
    image: grafana/grafana:12.0.2
    depends_on:
      - prometheus
      - influxdb
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      # dashboards without logging in; sign in as admin to edit
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/mds-health.json
      # nothing reaches outside the machine
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    networks:
      - mds

networks:
  # InfluxDB and mds reach each other by service name (http://influxdb:8086)
  mds:
    name: mds

volumes:
  influxdb-data:
  influxdb-config:
  prometheus-data:
  grafana-data:
