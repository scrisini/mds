# rescu is the HTTP client XChange uses for exchange REST calls (metadata, KuCoin's WebSocket token).
# XChange passes it the proxy host and port from mds.socks-proxy; this sets the proxy type to match.
# With no proxy host configured rescu connects directly, so this has no effect by default.
# MarketStreamManager refuses to start with a proxy configured if this is not SOCKS.
rescu.http.readProxyType=SOCKS
