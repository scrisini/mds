spring:
  application:
    name: mds
  threads:
    virtual:
      enabled: true

server:
  port: 8080

mds:
  exchanges: ${MDS_EXCHANGES:binance,kraken,bitstamp,kucoin,bitfinex}
  pairs: ${MDS_PAIRS:BTC/USDT,ETH/USDT,BTC/USD,ETH/USD}
  connection-timeout: 10s
  reconnect-delay: 5s
  stale-after: 60s
  archive:
    enabled: true
    interval: ${MDS_ARCHIVE_INTERVAL:5s}
  # Real-time subscriptions (SSE and WebSocket)
  stream:
    default-throttle: 1s        # when a client asks for no rate
    min-throttle: 100ms         # also caps rate=N at 10 updates per second
    max-throttle: 60s
    timeout: 30m                # SSE connection lifetime; WebSocket idle timeout
    max-subscribers: 1000       # SSE connections + WebSocket pair subscriptions
    allow-unthrottled: ${MDS_STREAM_ALLOW_UNTHROTTLED:true}   # permit rate=unlimited
    allowed-origins: ${MDS_STREAM_ALLOWED_ORIGINS:*}          # browser origins allowed to open WebSockets
  ohlc:
    # midnight in this zone starts each day/week (Monday)/month/year candle
    zone: ${MDS_OHLC_ZONE:UTC}
    flush-interval: 10s
  # SOCKS5 proxy for all exchange traffic (WebSocket and REST); blank host = direct. InfluxDB is not proxied.
  socks-proxy:
    host: ${MDS_SOCKS_PROXY_HOST:}
    port: ${MDS_SOCKS_PROXY_PORT:1080}
  # Embedded Hazelcast cluster: every instance sharing an InfluxDB bucket must join the same one.
  # No members and no Kubernetes service = a cluster of one. Cluster traffic is not proxied, encrypted
  # or authenticated: only other mds instances may reach the port.
  cluster:
    name: ${MDS_CLUSTER_NAME:mds}
    port: ${MDS_CLUSTER_PORT:5701}
    # host or host:port of other instances, comma-separated, e.g. 10.0.0.2,10.0.0.3:5701
    members: ${MDS_CLUSTER_MEMBERS:}
    # headless Service listing the pods, e.g. mds-hz.prod.svc.cluster.local
    kubernetes-service-dns: ${MDS_CLUSTER_KUBERNETES_SERVICE_DNS:}
    rebalance:
      enabled: ${MDS_CLUSTER_REBALANCE_ENABLED:true}
      interval: 10s
      tolerance: 0.2
      max-per-round: 20
  # Precision of every price and volume; fixed at startup. Range is ±Long.MAX_VALUE / 10^scale.
  decimal:
    scale: ${MDS_DECIMAL_SCALE:8}
    rounding: ${MDS_DECIMAL_ROUNDING:HALF_EVEN}
  influx:
    url: ${MDS_INFLUX_URL:http://localhost:8086}
    token: ${MDS_INFLUX_TOKEN:mds-dev-token}
    org: ${MDS_INFLUX_ORG:mds}
    bucket: ${MDS_INFLUX_BUCKET:prices}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: mds
    distribution:
      # REST API calls are timed by Spring as http.server.requests (tags: method, uri, status, outcome)
      percentiles:
        http.server.requests: 0.5,0.95,0.99
        mds.influx: 0.5,0.95,0.99

logging:
  level:
    com.mds: INFO
    # XChange logs every HTTP call and WebSocket (re)subscription at INFO
    si.mazi.rescu: WARN
    info.bitrich.xchangestream: WARN
    # Hazelcast logs its banner, partition tables and every connection at INFO; membership
    # changes are logged as coded events (MDS-32xx)
    com.hazelcast: WARN
  structured:
    format:
      # ecs in production: one Elastic Common Schema JSON object per line (ELK, Splunk, New Relic).
      # Blank (the default) gives the readable text pattern below. See docs/runbook.md.
      console: ${MDS_LOG_FORMAT:}
    ecs:
      service:
        environment: ${MDS_ENVIRONMENT:local}
  pattern:
    # Text format: the request id after the logger, catalogued details as key="value"
    console: "%d{HH:mm:ss.SSS} %5p [%t] %logger{36} %X{http.request.id} - %m %kvp%n%ex"
