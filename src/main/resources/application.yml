spring:
  application:
    name: mds
  config:
    # Configuration from AWS SSM Parameter Store, then secrets from Vault, read once at startup. Each
    # does nothing until mds.ssm.path / mds.vault.address is set below ("optional" covers only that:
    # a configured store that can't be read stops startup). See README "Configuration and secrets";
    # precedence: command line > environment > Vault > Parameter Store > this file.
    import:
      - "optional:mds-ssm:"
      - "optional:mds-vault:"
  threads:
    virtual:
      enabled: true
  lifecycle:
    # Each shutdown phase (web server, then exchange streams, then candles) waits at most this long. The
    # container's stop timeout must cover it; see docs/deployment.md "Timeouts".
    timeout-per-shutdown-phase: 30s

server:
  port: 8080
  # On SIGTERM: stop accepting, let in-flight requests finish, then stop (the default, made explicit).
  shutdown: graceful
  tomcat:
    # Must outlast the load balancer's idle timeout (ALB: 120s in docs/deployment.md), or the load
    # balancer reuses a connection Tomcat is closing and the client gets a 502. Tomcat's default is 60s.
    keep-alive-timeout: ${MDS_SERVER_KEEP_ALIVE_TIMEOUT:130s}

mds:
  # production refuses settings that are unsafe there: no SSM or Vault, the development InfluxDB token,
  # text logs, WebSocket origins '*', rate=unlimited (README "Production mode")
  mode: ${MDS_MODE:development}
  # Re-reads Parameter Store and Vault and checks a restart would succeed (README "Checking the stored
  # configuration"); also on demand: POST /actuator/configcheck
  config-check:
    interval: ${MDS_CONFIG_CHECK_INTERVAL:5m}
  exchanges: ${MDS_EXCHANGES:binance,kraken,bitstamp,kucoin,bitfinex}
  pairs: ${MDS_PAIRS:BTC/USDT,ETH/USDT,BTC/USD,ETH/USD}
  connection-timeout: 10s
  reconnect-delay: 5s
  stale-after: 60s
  archive:
    enabled: true
    interval: ${MDS_ARCHIVE_INTERVAL:5s}
  # Real-time subscriptions (SSE and WebSocket)
  stream:
    default-throttle: 1s        # when a client asks for no rate
    min-throttle: 100ms         # also caps rate=N at 10 updates per second
    max-throttle: 60s
    timeout: 30m                # SSE connection lifetime; WebSocket idle timeout
    max-subscribers: 1000       # SSE connections + WebSocket pair subscriptions
    allow-unthrottled: ${MDS_STREAM_ALLOW_UNTHROTTLED:true}   # permit rate=unlimited
    allowed-origins: ${MDS_STREAM_ALLOWED_ORIGINS:*}          # browser origins allowed to open WebSockets
    # An SSE comment / WebSocket ping on every open stream, so load balancers (ALB idle timeout:
    # 120s in docs/deployment.md) don't close quiet ones. 0 = off.
    heartbeat: ${MDS_STREAM_HEARTBEAT:30s}
  ohlc:
    # midnight in this zone starts each day/week (Monday)/month/year candle
    zone: ${MDS_OHLC_ZONE:UTC}
    flush-interval: 10s
  # SOCKS5 proxy for all exchange traffic (WebSocket and REST); blank host = direct. InfluxDB is not proxied.
  socks-proxy:
    host: ${MDS_SOCKS_PROXY_HOST:}
    port: ${MDS_SOCKS_PROXY_PORT:1080}
  # AWS SSM Parameter Store: /mds/prod/mds/pairs (or /mds/prod/mds.pairs) sets mds.pairs. Blank path = off.
  # Credentials and region from the AWS SDK default chain; reached directly (VPC endpoint), not proxied.
  ssm:
    path: ${MDS_SSM_PATH:}
    region: ${MDS_SSM_REGION:}
    endpoint: ${MDS_SSM_ENDPOINT:}
  # HashiCorp Vault key/value secret whose keys are property names, e.g. mds.influx.token. Blank
  # address = off; https only (http for localhost). Reached directly on the private network.
  vault:
    address: ${MDS_VAULT_ADDRESS:}
    kv-mount: ${MDS_VAULT_KV_MOUNT:secret}
    path: ${MDS_VAULT_PATH:mds}
    kv-version: 2
    namespace: ${MDS_VAULT_NAMESPACE:}
    ca-cert: ${MDS_VAULT_CA_CERT:}
    # token | kubernetes | app-role
    auth: ${MDS_VAULT_AUTH:token}
    token: ${MDS_VAULT_TOKEN:}
    kubernetes:
      role: ${MDS_VAULT_KUBERNETES_ROLE:}
    app-role:
      role-id: ${MDS_VAULT_APP_ROLE_ID:}
      secret-id-file: ${MDS_VAULT_APP_ROLE_SECRET_ID_FILE:}
  # Embedded Hazelcast cluster: every instance sharing an InfluxDB bucket must join the same one.
  # No members and no Kubernetes service = a cluster of one. Cluster traffic is not proxied, encrypted
  # or authenticated: only other mds instances may reach the port.
  cluster:
    name: ${MDS_CLUSTER_NAME:mds}
    port: ${MDS_CLUSTER_PORT:5701}
    # host or host:port of other instances, comma-separated, e.g. 10.0.0.2,10.0.0.3:5701
    members: ${MDS_CLUSTER_MEMBERS:}
    # headless Service listing the pods, e.g. mds-hz.prod.svc.cluster.local
    kubernetes-service-dns: ${MDS_CLUSTER_KUBERNETES_SERVICE_DNS:}
    rebalance:
      enabled: ${MDS_CLUSTER_REBALANCE_ENABLED:true}
      interval: 10s
      tolerance: 0.2
      max-per-round: 20
  # Precision of every price and volume; fixed at startup. Range is ±Long.MAX_VALUE / 10^scale.
  decimal:
    scale: ${MDS_DECIMAL_SCALE:8}
    rounding: ${MDS_DECIMAL_ROUNDING:HALF_EVEN}
  influx:
    url: ${MDS_INFLUX_URL:http://localhost:8086}
    token: ${MDS_INFLUX_TOKEN:mds-dev-token}
    org: ${MDS_INFLUX_ORG:mds}
    bucket: ${MDS_INFLUX_BUCKET:prices}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,configcheck
  endpoint:
    health:
      show-details: always
      # /actuator/health/liveness and /readiness everywhere, not only on Kubernetes: load balancer
      # health checks use readiness (docs/deployment.md)
      probes:
        enabled: true
  info:
    env:
      enabled: true
  metrics:
    tags:
      application: mds
      mode: ${mds.mode}
    distribution:
      # REST API calls are timed by Spring as http.server.requests (tags: method, uri, status, outcome)
      percentiles:
        http.server.requests: 0.5,0.95,0.99
        mds.influx: 0.5,0.95,0.99

# /actuator/info
info:
  mode: ${mds.mode}

logging:
  level:
    com.mds: INFO
    # XChange logs every HTTP call and WebSocket (re)subscription at INFO
    si.mazi.rescu: WARN
    info.bitrich.xchangestream: WARN
    # Hazelcast logs its banner, partition tables and every connection at INFO; membership
    # changes are logged as coded events (MDS-32xx)
    com.hazelcast: WARN
  structured:
    format:
      # ecs in production: one Elastic Common Schema JSON object per line (ELK, Splunk, New Relic).
      # Blank (the default) gives the readable text pattern below. See docs/runbook.md.
      console: ${MDS_LOG_FORMAT:}
    ecs:
      service:
        environment: ${MDS_ENVIRONMENT:local}
  pattern:
    # Text format: the request id after the logger, catalogued details as key="value"
    console: "%d{HH:mm:ss.SSS} %5p [%t] %logger{36} %X{http.request.id} - %m %kvp%n%ex"
