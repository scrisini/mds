# Test members form their own cluster: a unique name and ports away from a local mds (5701), so a test
# never joins, or is joined by, a running instance
mds.cluster.name=mds-test-${random.uuid}
mds.cluster.port=5901
# A free port for the gRPC server, so tests run alongside a local instance on 9090 and each other
spring.grpc.server.port=0
