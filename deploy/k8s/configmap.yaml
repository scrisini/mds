# Only what an instance needs to find its configuration and its peers. Everything else comes from
# SSM Parameter Store (settings) and Vault (secrets such as mds.influx.token): README
# "Configuration and secrets".
apiVersion: v1
kind: ConfigMap
metadata:
  name: mds-env
data:
  # Refuses unsafe settings at startup and in the configuration check (README "Production mode")
  MDS_MODE: production
  MDS_ENVIRONMENT: prod
  MDS_LOG_FORMAT: ecs
  # The headless Service in services.yaml: <service>.<namespace>.svc.cluster.local
  MDS_CLUSTER_KUBERNETES_SERVICE_DNS: mds-hz.mds.svc.cluster.local
  MDS_INFLUX_URL: http://influxdb:8086
  MDS_SSM_PATH: /mds/prod/                         # CHANGE
  MDS_SSM_REGION: ap-southeast-2                   # CHANGE
  MDS_VAULT_ADDRESS: https://vault.internal:8200   # CHANGE
  MDS_VAULT_AUTH: kubernetes
  MDS_VAULT_KUBERNETES_ROLE: mds
  MDS_VAULT_PATH: mds/prod
  MDS_STREAM_ALLOWED_ORIGINS: https://app.example.com   # CHANGE: sites whose pages open WebSockets
  MDS_STREAM_ALLOW_UNTHROTTLED: "false"
  # The image's launcher prints a native-memory report to stdout at exit; keep stdout JSON only
  BPL_JAVA_NMT_ENABLED: "false"
  # gRPC buffers outside the heap, up to 32 KB per stream while a client isn't reading; the image's
  # default of 10 MB would be too little for thousands of streams. Taken from the heap budget.
  JAVA_TOOL_OPTIONS: -XX:MaxDirectMemorySize=192m
