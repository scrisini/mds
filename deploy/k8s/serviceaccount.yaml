apiVersion: v1
kind: ServiceAccount
metadata:
  name: mds
  annotations:
    # IAM role for SSM Parameter Store reads (IRSA; or use an EKS Pod Identity association instead).
    # Its token is also how mds logs in to Vault (MDS_VAULT_AUTH=kubernetes).
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/mds   # CHANGE
