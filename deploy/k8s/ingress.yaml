# An internet-facing ALB, created by the AWS Load Balancer Controller. Timeouts and why:
# docs/deployment.md "Timeouts".
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mds
  annotations:
    # one ALB for HTTP and gRPC: ingress-grpc.yaml joins the same group
    alb.ingress.kubernetes.io/group.name: mds
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-southeast-2:123456789012:certificate/CHANGE
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-2021-06
    # idle timeout 120s: four stream heartbeats (30s, mds.stream.heartbeat), and shorter than mds's
    # keep-alive (130s, server.tomcat.keep-alive-timeout)
    alb.ingress.kubernetes.io/load-balancer-attributes: >-
      idle_timeout.timeout_seconds=120,routing.http.drop_invalid_header_fields.enabled=true
    # draining 30s: covers the 20s preStop; least outstanding requests counts open SSE streams
    alb.ingress.kubernetes.io/target-group-attributes: >-
      deregistration_delay.timeout_seconds=30,load_balancing.algorithm.type=least_outstanding_requests
    alb.ingress.kubernetes.io/healthcheck-path: /actuator/health/readiness
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "10"
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: "5"
    alb.ingress.kubernetes.io/healthy-threshold-count: "2"
    alb.ingress.kubernetes.io/unhealthy-threshold-count: "3"
    alb.ingress.kubernetes.io/success-codes: "200"
spec:
  ingressClassName: alb
  rules:
    - host: mds.example.com          # CHANGE
      http:
        paths:
          # Only the API is public: /actuator (health details, metrics) stays inside the cluster.
          - path: /api/
            pathType: Prefix
            backend:
              service:
                name: mds
                port:
                  name: http
